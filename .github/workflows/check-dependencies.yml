name: Check Upstream Versions

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday 8am UTC
  workflow_dispatch:

permissions: {}

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write  # lets the job dispatch Build and ci on the bump branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for upstream updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHECKSUMS="download/checksums.json"
          UPDATES=""

          gh_api() {
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1" || true
          }

          ver_gt() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          # app -> github repo whose tags define the version. Tarball URL is
          # rewritten from the pinned URL by version substitution, so every
          # entry's URL shape must contain the literal version.
          declare -A REPOS=(
            [voxtype]=peteonrails/voxtype
            [moonlight-qt]=moonlight-stream/moonlight-qt
          )

          for app in "${!REPOS[@]}"; do
            CURRENT=$(jq -r --arg a "$app" '.[$a].version' "$CHECKSUMS")
            LATEST=$(gh_api "https://api.github.com/repos/${REPOS[$app]}/tags?per_page=30" |
              jq -r '.[].name | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sed 's/^v//' | sort -V | tail -n1)
            if [[ -n "$LATEST" && "$LATEST" != "null" ]] && ver_gt "$LATEST" "$CURRENT"; then
              OLD_URL=$(jq -r --arg a "$app" '.[$a].url' "$CHECKSUMS")
              NEW_URL="${OLD_URL//$CURRENT/$LATEST}"
              TMP=$(mktemp)
              if curl -fsSL --retry 3 --max-time 300 -o "$TMP" "$NEW_URL"; then
                SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
                jq --arg a "$app" --arg u "$NEW_URL" --arg s "$SHA" --arg v "$LATEST" \
                  '.[$a].url=$u | .[$a].sha256=$s | .[$a].version=$v' \
                  "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
                UPDATES="${UPDATES}${app}: $CURRENT -> $LATEST\n"
              else
                echo "::warning::$app: $LATEST tagged but $NEW_URL not fetchable; skipping"
              fi
              rm -f "$TMP"
            fi
          done

          if [[ -n "$UPDATES" ]]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            {
              echo "updates<<EOF"
              echo -e "$UPDATES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        id: cpr
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pinned upstream versions"
          title: "chore: update pinned upstream versions"
          body: |
            Automated upstream version bump:

            ```
            ${{ steps.check.outputs.updates }}
            ```

            CI builds every package from the new pins; merge only when the
            full matrix is green.
          branch: update-upstream-versions
          delete-branch: true
          # GitHub starts no pull_request_target run for a PR that
          # GITHUB_TOKEN opens, so the PR triage caller never labels this PR
          # (frostyard/core#233). The bot labels it here instead. add-paths
          # limits the commit to download/checksums.json, so the PR level is
          # the level of that file in .github/risk-paths.json: L1
          # (download/**), which also takes risk:high (core
          # docs/specs/pr-triage.md). tests/check-baseline.sh checks that
          # these labels match that level.
          add-paths: download/checksums.json
          labels: |
            level:L1
            risk:high

      # GitHub does not start pull_request workflows for a pull request that
      # GITHUB_TOKEN opens or updates: that Build run waits in action_required
      # and expires after 30 days. GITHUB_TOKEN can start workflow_dispatch,
      # so dispatch Build and ci on the bump branch. Their checks attach to the
      # head commit and show on the pull request. ci is the gate check, so the
      # bump PR must run it too. Build's release job runs only on main.
      - name: Build the bump branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref update-upstream-versions

      - name: Run ci on the bump branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref update-upstream-versions
