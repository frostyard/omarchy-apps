# Risk paths (core ADR-0068, docs/specs/risk-paths.md): this caller runs on
# pull_request_target so the base risk list and trusted caller execute. It does
# not run a PR branch. It checks out nothing. It is not a required check. The
# repository must have the risk:high label, or this job fails.
name: Risk paths caller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  risk-paths:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/risk-paths.yml@ed474fbbcf8351a643124c2d35b7d8c5fdd0f915 # frostyard/core main, 2026-11-06 (core has no release tags)
