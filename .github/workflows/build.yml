name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older pull request build, but never a main run:
# cancelling one between its release and its publication request would leave
# a release that apt-publisher never publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      HOME: "/root"
    strategy:
      fail-fast: false
      matrix:
        app:
          - ttfx
          - herdr
          - tensaku
          - hyprland-preview-share-picker
          - cliamp
          - aether
          - voxtype
          - omacalc
          - omacut
          - omawrite
          - gpu-screen-recorder
          - moonlight-qt

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build package
        run: bash build.sh "${{ matrix.app }}"

      - name: Verify package installs and runs
        run: |
          apt-get update
          apt-get install --yes ./dist/*.deb
          smoke=$(bash -c 'source apps/"${{ matrix.app }}".sh >/dev/null 2>&1 || true; echo "$APP_SMOKE"')
          echo "smoke: $smoke"
          bash -c "$smoke"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.app }}
          path: dist/*.deb

  # Publication goes through frostyard/apt-publisher, the single writer of
  # https://repository.frostyard.org/debian/ (frostyard/core ADR-0055). This
  # repository holds no signing key and no bucket credentials: it attaches the
  # packages to a GitHub release and asks apt-publisher to publish that release.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'frostyard/omarchy-apps' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 20
    permissions:
      contents: write # create the release and its tag
      attestations: write # store the build provenance attestations
      id-token: write # sign the attestations with this workflow's identity
    outputs:
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: deb-*
          merge-multiple: true
          path: ./dist

      # apt-publisher publishes every .deb in the release and refuses names
      # outside omarchy-apps' entry in its config/producers.tsv. The release
      # must therefore hold exactly one Debian 13 amd64 build of each app.
      # Adding an app means adding it here, to the build matrix, and to
      # producers.tsv in frostyard/apt-publisher.
      - name: Check the packages
        id: check
        run: |
          set -euo pipefail
          shopt -s nullglob
          want="aether cliamp gpu-screen-recorder herdr hyprland-preview-share-picker moonlight-qt omacalc omacut omawrite tensaku ttfx voxtype"
          names=()
          for deb in dist/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            version=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            size=$(stat -c %s "$deb")
            if [[ $arch != amd64 ]]; then
              echo "::error::$deb is built for $arch, not amd64"
              exit 1
            fi
            if [[ ! $version =~ ^[0-9][A-Za-z0-9.+]*-frostyard[0-9]{14}$ ]]; then
              echo "::error::$deb has version $version, which is not an omarchy-apps build"
              exit 1
            fi
            if [[ $(basename "$deb") != "${name}_${version}_${arch}.deb" ]]; then
              echo "::error::$deb is not named ${name}_${version}_${arch}.deb"
              exit 1
            fi
            if ((size >= 2147483648)); then
              echo "::error::$deb is $size bytes; GitHub release assets must be under 2 GiB"
              exit 1
            fi
            names+=("$name")
          done
          got=$(printf '%s\n' "${names[@]}" | sort | paste -sd ' ')
          if [[ $got != "$want" ]]; then
            echo "::error::expected the packages: $want; found: ${got:-none}"
            exit 1
          fi
          echo "tag=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      # Binds each .deb to this workflow run. Verify with
      # gh attestation verify FILE --repo frostyard/omarchy-apps --source-ref refs/heads/main
      # apt-publisher registers omarchy-apps with attested=no, because it
      # verifies against refs/tags/<tag> and these releases come from main.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      # gh uploads the assets to a draft and publishes it once all are
      # attached, so apt-publisher never sees a partial release. An existing
      # release fails this step instead of being changed.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.deb --target "$GITHUB_SHA" --latest \
            --title "$TAG" \
            --notes "Debian 13 (trixie) amd64 build of main at $GITHUB_SHA. frostyard/apt-publisher publishes it to https://repository.frostyard.org/debian/ (trixie)."

  # Not continue-on-error: if the request fails, nothing was published and
  # the run must fail. Re-running this job alone requests the same release
  # again. The packages link trixie's libraries and carry no ~debNN marker,
  # so the request names trixie, the only codename omarchy-apps may use.
  request-publication:
    name: Request APT publication
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Request APT publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.APT_PUBLISH_TOKEN }}
          repository: frostyard/apt-publisher
          event-type: publish-deb
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ needs.release.outputs.tag }}", "codenames": ["trixie"]}'
