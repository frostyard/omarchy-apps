name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Also rebuild and publish this app on main, whether or not its inputs changed"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# A newer push cancels an older pull request build, but never a main run:
# cancelling one between its release and its publication request would leave
# a release that apt-publisher never publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fast gate: the scripts, the plan script and its tests, before any build.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every file at once: the scripts pass their `# shellcheck source=`
      # paths against this input list. ubuntu-latest ships shellcheck.
      - name: Shellcheck
        run: |
          set -euo pipefail
          shopt -s nullglob
          shellcheck build.sh plan.sh lib/*.sh apps/*.sh download/*.sh tests/*.sh

      - name: Run the tests
        run: bash tests/run.sh

  # Which apps this run builds and publishes, from the published indexes and
  # the Frostyard-Inputs field of each app's newest published version.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: check
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The published trixie and forky main amd64 indexes: the record of what
      # apt serves for each codename. apt-publisher publishes the same unmarked
      # .deb files to both (frostyard/core ADR-0055), so an app that is missing
      # or stale in 1 index must publish again. A failed fetch fails the run
      # instead of rebuilding everything.
      - name: Fetch the published packages indexes
        env:
          TRIXIE_INDEX_URL: https://repository.frostyard.org/debian/dists/trixie/main/binary-amd64/Packages
          FORKY_INDEX_URL: https://repository.frostyard.org/debian/dists/forky/main/binary-amd64/Packages
          TRIXIE_INDEX: ${{ runner.temp }}/Packages-trixie
          FORKY_INDEX: ${{ runner.temp }}/Packages-forky
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --output "$TRIXIE_INDEX" "$TRIXIE_INDEX_URL"
          curl -fsSL --retry 3 --retry-delay 2 --output "$FORKY_INDEX" "$FORKY_INDEX_URL"

      - name: Decide what to build and publish
        id: decide
        env:
          TRIXIE_INDEX: ${{ runner.temp }}/Packages-trixie
          FORKY_INDEX: ${{ runner.temp }}/Packages-forky
          REBUILD: ${{ inputs.rebuild }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          # stderr: one decision line per app; the summary table is for the run page.
          plan=$(bash plan.sh --packages "$TRIXIE_INDEX" --packages "$FORKY_INDEX" \
            --rebuild "$REBUILD" --summary "$GITHUB_STEP_SUMMARY")
          if [[ $ON_MAIN == true ]]; then
            build=$plan
            publish=$plan
          else
            # A pull request, or a dispatch on another branch: build every app
            # so the change is tested, and publish nothing.
            build=$(
              for f in apps/*.sh; do
                f=${f##*/}
                printf '%s\n' "${f%.sh}"
              done | jq -R . | jq -cs 'sort'
            )
            publish='[]'
            {
              echo
              echo "This run is not on \`main\`: it builds every app and publishes nothing."
              echo "A push to \`main\` with these inputs would publish \`${plan}\`."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "build=$build"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: plan
    # Nothing changed: no matrix, and the release and publication jobs skip.
    if: needs.plan.outputs.build != '[]'
    container:
      image: debian:trixie
    # A container job runs steps with sh by default; the steps use bash.
    defaults:
      run:
        shell: bash
    env:
      HOME: "/root"
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.build) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build package
        env:
          APP: ${{ matrix.app }}
        run: bash build.sh "$APP"

      - name: Verify package installs and runs
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes ./dist/*.deb
          smoke=$(bash -c 'source "apps/$APP.sh" >/dev/null 2>&1 || true; echo "$APP_SMOKE"')
          echo "smoke: $smoke"
          bash -c "$smoke"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.app }}
          path: dist/*.deb

  # The same .deb files are published to trixie and forky: they carry no ~debNN
  # marker (frostyard/core ADR-0055), so Debian 14's libraries must satisfy them
  # as well. This job installs each package in debian:forky and runs the app's
  # smoke test there; omarchy-apps' registration for forky in apt-publisher's
  # config/producers.tsv is the compatibility record.
  smoke-forky:
    name: Smoke test on Debian Forky (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [plan, build]
    # Nothing changed: the matrix is empty, and the release skips with it.
    if: needs.plan.outputs.build != '[]'
    container:
      image: debian:forky
    # A container job runs steps with sh by default; the steps use bash.
    defaults:
      run:
        shell: bash
    env:
      HOME: "/root"
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.build) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.app }}
          path: ./dist

      - name: Verify package installs and runs on forky
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes ./dist/*.deb
          smoke=$(bash -c 'source "apps/$APP.sh" >/dev/null 2>&1 || true; echo "$APP_SMOKE"')
          echo "smoke: $smoke"
          bash -c "$smoke"

  # Publication goes through frostyard/apt-publisher, the single writer of
  # https://repository.frostyard.org/debian/ (frostyard/core ADR-0055). This
  # repository holds no signing key and no bucket credentials: it attaches the
  # packages to a GitHub release and asks apt-publisher to publish that release.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [plan, build, smoke-forky]
    if: github.repository == 'frostyard/omarchy-apps' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.publish != '[]'
    timeout-minutes: 20
    permissions:
      contents: write # create the release and its tag
      attestations: write # store the build provenance attestations
      id-token: write # sign the attestations with this workflow's identity
    outputs:
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: ./dist

      # apt-publisher publishes every .deb in the release and refuses names
      # outside omarchy-apps' entry in its config/producers.tsv. The release
      # must therefore hold exactly one Debian 13 amd64 build of each app this
      # run publishes -- the apps whose inputs changed, or the one app named by
      # the rebuild input, not every app -- and nothing else.
      - name: Check the packages
        id: check
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          want=$(printf '%s' "$PUBLISH" | jq -r '.[]' | sort | paste -sd ' ')
          names=()
          for deb in dist/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            version=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            inputs=$(dpkg-deb -f "$deb" Frostyard-Inputs || true)
            size=$(stat -c %s "$deb")
            if [[ $arch != amd64 ]]; then
              echo "::error::$deb is built for $arch, not amd64"
              exit 1
            fi
            if [[ ! $version =~ ^[0-9][A-Za-z0-9.+]*-frostyard[0-9]{14}$ ]]; then
              echo "::error::$deb has version $version, which is not an omarchy-apps build"
              exit 1
            fi
            if [[ $(basename "$deb") != "${name}_${version}_${arch}.deb" ]]; then
              echo "::error::$deb is not named ${name}_${version}_${arch}.deb"
              exit 1
            fi
            if [[ ! $inputs =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$deb has no valid Frostyard-Inputs field (${inputs:-none}); the next plan cannot see it"
              exit 1
            fi
            if ((size >= 2147483648)); then
              echo "::error::$deb is $size bytes; GitHub release assets must be under 2 GiB"
              exit 1
            fi
            names+=("$name")
          done
          got=$(printf '%s\n' "${names[@]}" | sort | paste -sd ' ')
          if [[ $got != "$want" ]]; then
            echo "::error::expected the packages: ${want:-none}; found: ${got:-none}"
            exit 1
          fi
          echo "tag=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      # Binds each .deb to this workflow run. Verify with
      # gh attestation verify FILE --repo frostyard/omarchy-apps --source-ref refs/heads/main
      # apt-publisher registers omarchy-apps as build.yml@refs/heads/main and
      # verifies with --signer-workflow and --source-ref (its ADR-0004).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      # gh uploads the assets to a draft and publishes it once all are
      # attached, so apt-publisher never sees a partial release. An existing
      # release fails this step instead of being changed.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.deb --target "$GITHUB_SHA" --latest \
            --title "$TAG" \
            --notes "Debian 13 (trixie) amd64 build of main at $GITHUB_SHA. frostyard/apt-publisher publishes these unmarked packages to https://repository.frostyard.org/debian/ for trixie and forky."

  # Not continue-on-error: if the request fails, nothing was published and
  # the run must fail. Re-running this job alone requests the same release
  # again. The packages carry no ~debNN marker, so apt-publisher publishes the
  # same .deb files to every codename the request names (frostyard/core
  # ADR-0055): they are built and installed on trixie, installed again on
  # forky above, and omarchy-apps is registered for both codenames in
  # apt-publisher's config/producers.tsv.
  request-publication:
    name: Request APT publication
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Request APT publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.APT_PUBLISH_TOKEN }}
          repository: frostyard/apt-publisher
          event-type: publish-deb
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ needs.release.outputs.tag }}", "codenames": ["trixie", "forky"]}'
